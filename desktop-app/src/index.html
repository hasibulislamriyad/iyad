function notesHtml(){return st.notes.length?st.notes.map(function(n,i){return '<div class="clip"><span class="cp" style="cursor:default;white-space:normal;padding:8px 0;overflow:visible">'+esc(n)+'</span><button class="pin" data-delnote="'+i+'">Delete</button></div>'}).join(''):'<span style="font-size:12.5px;color:var(--dim)">Kono note nai. Upore likho, Enter chap.</span>'}
function sw(label,act,on){return '<div class="row"><span>'+label+'</span><button class="sw" role="switch" aria-label="'+label+'" aria-checked="'+on+'" data-act="'+act+'"></button></div>'}
function render(){railHtml();var h='',n=new Date(),mins=n.getHours()*60+n.getMinutes(),pct=Math.max(0,Math.min(100,Math.round((mins-360)/10.2))),rem=Math.max(0,1380-mins),t=st.m.title?esc(st.m.title):'Nothing playing';
if(st.tab==='home')h='<div class="bento"><div class="b w"><div><p class="t-label">'+n.toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'})+'</p><div class="num">'+n.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'</div></div><div style="font-size:12.5px;color:var(--dim)">'+Math.floor(rem/60)+'h '+rem%60+'m until bedtime (11 pm)</div></div><div class="b d"><div><p class="t-label">Day progress</p><div class="num">'+pct+'%</div></div><div class="bar"><i style="width:'+pct+'%"></i></div></div><div class="b p"><div style="min-width:0"><div style="font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+t+'</div><div style="font-size:12px;color:var(--dim)">'+esc(st.m.artist||'')+'</div></div></div></div>';
if(st.tab==='clip')h='<div class="ai"><div class="srch">'+ic('sr')+'<input id="cs" placeholder="Search clipboard" value="'+esc(st.q)+'"></div><div class="clips" id="cl">'+clipsHtml()+'</div></div>';
if(st.tab==='notes')h='<div class="ai"><div class="srch">'+ic('no')+'<input id="ni" placeholder="Likho kichu, Enter chap"><button class="btn" data-act="addnote" style="padding:6px 14px">Save</button></div><div class="clips" id="nl">'+notesHtml()+'</div></div>';
if(st.tab==='apps')h='<div class="apps">'+[['ge','Browser','#c3a6ff','browser'],['fo','Files','#f2a33a','files'],['ta','Terminal','#ff8f8f','cmd'],['no','Notepad','#8ee26b','note'],['tm','Calculator','#5bb4ff','calc']].map(function(a){return '<button class="app" data-app="'+a[3]+'"><span style="background:'+a[2]+'26;color:'+a[2]+'">'+ic(a[0])+'</span>'+a[1]+'</button>'}).join('')+'</div>';
if(st.tab==='focus')h='<div class="focus"><div class="ring"><svg width="128" height="128" viewBox="0 0 128 128"><circle cx="64" cy="64" r="56" fill="none" stroke="#ffffff1c" stroke-width="8"/><circle id="fring" cx="64" cy="64" r="56" fill="none" stroke="#8db3ff" stroke-width="8" stroke-linecap="round" stroke-dasharray="351.9" stroke-dashoffset="'+(351.9*(1-(st.len-st.left)/st.len))+'"/></svg><div class="num" id="ft">'+mmss(st.left)+'</div></div><div><p class="t-label">'+(st.focusOn?'Session running':'Ready when you are')+'</p><div style="display:flex;gap:8px"><button class="btn" data-act="fb">'+(st.focusOn?'Pause':'Start focus')+'</button><button class="btn g" data-act="fr">Reset</button></div><div class="chips">'+[15,25,50].map(function(m){return '<button class="chip" data-len="'+m+'" aria-pressed="'+(st.len===m*60)+'">'+m+' min</button>'}).join('')+'</div></div></div>';
if(st.tab==='music')h='<div class="music '+(st.m.playing?'playing':'')+'"><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px"><div style="min-width:0"><div style="font-size:18px;font-weight:600;letter-spacing:-.01em">'+t+'</div><div class="t-label" style="margin:3px 0 0">'+esc(st.m.available?st.m.artist:'Play something in Spotify or your browser')+'</div></div><div class="eq"><i></i><i></i><i></i><i></i><i></i></div></div><div class="ctl"><button data-m="prev" aria-label="Previous">'+ic('pv',1)+'</button><button class="main-b" data-m="toggle" aria-label="Play or pause">'+ic(st.m.playing?'pa':'pl',1)+'</button><button data-m="next" aria-label="Next">'+ic('nx',1)+'</button></div></div>';
if(st.tab==='set')h='<div class="two"><div class="list">'+sw('Hide in fullscreen apps','fs',st.fs)+sw('Collapse when I click away','blur',st.blur)+'</div><div class="col"><p class="t-label">Shortcut</p><div class="aiout" style="flex:none">Ctrl + Alt + Space opens or closes the notch.</div><button class="btn g" data-act="quit">Quit Notch</button></div></div>';
panel.innerHTML=h}
function capUpd(){var n=new Date(),a=[];if(st.focusOn)a.push('Focus  '+mmss(st.left));if(st.m.playing&&st.m.title)a.push(st.m.title);$('#clk').textContent=n.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});$('#capTxt').innerHTML=esc(a.length?a[0]:'Ready')+(a.length>1?'<b class="more">+'+(a.length-1)+'</b>':'');notch.style.width=(!st.open&&a.length>1)?'290px':''}
function setOpen(o){if(o===st.open)return;st.open=o;if(o){inv('set_expanded',{expanded:true}).then(function(){notch.classList.add('open');render();capUpd();say('Hi!')})}else{notch.classList.remove('open');capUpd();setTimeout(function(){if(!st.open)inv('set_expanded',{expanded:false})},520)}}
function addNote(){var i=$('#ni'),v=i.value.trim();if(!v)return;st.notes.unshift(v);save('notes',st.notes);i.value='';$('#nl').innerHTML=notesHtml();happy('Note save hoyeche.')}
function pollMedia(){inv('media_info').then(function(m){var ch=m.title!==st.m.title||m.playing!==st.m.playing;st.m=m;document.body.classList.toggle('groove',m.playing);if(ch&&st.open&&(st.tab==='music'||st.tab==='home'))render();capUpd()}).catch(function(){})}
$('#cap').onclick=function(){setOpen(true)};
document.addEventListener('click',function(e){var t;
if(t=e.target.closest('[data-t]')){st.tab=t.dataset.t;render();return}
if(t=e.target.closest('[data-app]')){
  var a=t.dataset.app,tg='';
  if(a==='browser')tg='https://google.com';
  if(a==='files')tg='C:\\';
  if(a==='cmd')tg='cmd.exe';
  if(a==='note')tg='notepad.exe';
  if(a==='calc')tg='calc.exe';
  if(tg)inv('plugin:shell|open',{path:tg});
  return;
}
if(t=e.target.closest('[data-m]')){inv('media_cmd',{cmd:t.dataset.m}).then(function(){setTimeout(pollMedia,400)});return}
if(t=e.target.closest('[data-len]')){if(!st.focusOn){st.len=st.left=+t.dataset.len*60;render()}return}
if(t=e.target.closest('[data-paste]')){inv('set_clipboard',{text:st.clips[t.dataset.paste].t});say('Copied again.');return}
if(t=e.target.closest('[data-pin]')){var c=st.clips[t.dataset.pin];c.p=!c.p;save('clips',st.clips);$('#cl').innerHTML=clipsHtml();return}
if(t=e.target.closest('[data-delnote]')){st.notes.splice(+t.dataset.delnote,1);save('notes',st.notes);$('#nl').innerHTML=notesHtml();return}
if(t=e.target.closest('[data-act]')){var a=t.dataset.act;
 if(a==='addnote')addNote();
 if(a==='fs'){st.fs=!st.fs;save('fs',st.fs);inv('set_autohide',{on:st.fs});render()}
 if(a==='blur'){st.blur=!st.blur;save('blur',st.blur);render()}
 if(a==='quit')inv('quit_app');
 if(a==='fb'){st.focusOn=!st.focusOn;if(st.focusOn){setMood('focus');say('Focus shuru. Ami-o kaj korchi.')}else setMood('idle');render()}
 if(a==='fr'){st.focusOn=false;st.left=st.len;setMood('idle');render()}}});
document.addEventListener('input',function(e){if(e.target.id==='cs'){st.q=e.target.value;$('#cl').innerHTML=clipsHtml()}});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='ni')addNote();if(e.key==='Escape')setOpen(false)});
window.addEventListener('blur',function(){if(st.open&&st.blur)setOpen(false)});
lis('hotkey',function(){setOpen(!st.open)});
lis('clip',function(e){var t=String(e.payload);if(t.length>2000)return;var i=st.clips.findIndex(function(c){return c.t===t});var p=false;if(i>-1){p=st.clips[i].p;st.clips.splice(i,1)}st.clips.unshift({t:t,p:p});var keep=0;st.clips=st.clips.filter(function(c){return c.p||++keep<=50});save('clips',st.clips);var l=$('#cl');if(l)l.innerHTML=clipsHtml();happy('Copied to history.')});
setInterval(function(){if(st.focusOn){st.left--;if(st.left<=0){st.focusOn=false;st.left=st.len;happy('Session shesh! Valo kaj.');if(st.open&&st.tab==='focus')render()}else{var f=$('#ft');if(f){f.textContent=mmss(st.left);$('#fring').setAttribute('stroke-dashoffset',351.9*(1-(st.len-st.left)/st.len))}}}capUpd()},1000);
setInterval(pollMedia,2000);pollMedia();
document.addEventListener('pointermove',function(e){document.querySelectorAll('.bug').forEach(function(b){var r=b.getBoundingClientRect();if(!r.width)return;var a=Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2));b.querySelectorAll('.pup').forEach(function(p,i){p.setAttribute('cx',(i?64:36)+Math.cos(a)*3.4);p.setAttribute('cy',53+Math.sin(a)*3)})})});
var idle;function wake(){clearTimeout(idle);if(st.mood==='sleepy')setMood(st.focusOn?'focus':'idle');idle=setTimeout(function(){if(!st.focusOn){setMood('sleepy');say('Zzz…')}},60000)}
['pointermove','keydown','click'].forEach(function(v){document.addEventListener(v,wake)});wake();setMood('idle');capUpd();
</script></body></html>
